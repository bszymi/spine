name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# INIT-011 / EPIC-001 / TASK-005: minimum-viable CI that enforces the
# ADR-017 boundary on every PR. The boundary lint runs first so a
# tier violation is the most obvious failure surfaced.
#
# Standalone build is exercised in two forms:
#   1. `make build` — the production service binary at service/cmd/spine
#   2. `go build ./cmd/embed-smoketest` — the library-consumer smoke test
#      (ADR-022 Option A enforcement: Spine Core must remain linkable
#      without the service tier).
# A standalone build that pulls in SMP via a future drive-by import
# would fail to link, complementing the lint as a secondary guard.

jobs:
  boundary-lint:
    name: ADR-017 boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Dependency-direction guard
        run: ./dev/lint-boundaries.sh

  build:
    name: Build (service + embed-smoketest)
    runs-on: ubuntu-latest
    needs: boundary-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build service binary
        run: make build

      - name: Build embed-smoketest (library-consumer)
        run: go build -o bin/embed-smoketest ./cmd/embed-smoketest

      - name: Run embed-smoketest
        run: ./bin/embed-smoketest

  test:
    name: go test ./...
    runs-on: ubuntu-latest
    needs: boundary-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./...

  # INIT-023 / EPIC-001 / TASK-001: the git push scenarios
  # (service/scenariotest/scenarios, TestGitHTTP_*) drive the real
  # pre-receive gate end to end — accepted push, policy rejection,
  # operator override with exactly one event, contributor override
  # refused, no-delete, unused override, all-or-nothing mixed push,
  # byte-identical commit. They need Postgres and SKIP without
  # SPINE_TEST_DATABASE_URL, so `go test ./...` above never runs them
  # (it does not even compile the `scenario` tag). This job runs them
  # against a disposable Postgres and fails if any of them skips.
  #
  # Scoped to TestGitHTTP_* on purpose: the rest of the scenario suite
  # is not green on main today, and repairing it is outside this task.
  #
  # INIT-023 / EPIC-004 / TASK-013 adds the two bootstrap-admin
  # scenarios (TestBootstrapInternalAdmin_*): the only Postgres-backed
  # proof that an SMP_ADMIN_TOKEN rotation revokes the right
  # auth.tokens row (ListTokensByActor + RevokeToken against real SQL)
  # and that the old bearer then gets 401. Both are green and must
  # never skip either.
  scenario-git-http:
    name: Git push scenarios (Postgres)
    runs-on: ubuntu-latest
    needs: boundary-lint
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: spine_test
          POSTGRES_PASSWORD: spine_test
          POSTGRES_DB: spine_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U spine_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      SPINE_TEST_DATABASE_URL: postgres://spine_test:spine_test@localhost:5433/spine_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: TestGitHTTP_* scenarios (must pass, never skip)
        shell: bash
        run: |
          go test -tags scenario -count=1 -run '^TestGitHTTP_' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-git-http.log
          # Any skip fails the job: a top-level one (the database is not
          # reachable) or an indented one inside a scenario step.
          if grep -E '^[[:space:]]*--- SKIP: TestGitHTTP_' scenario-git-http.log; then
            echo "::error::a TestGitHTTP_ scenario or step skipped — they must pass, never skip"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestGitHTTP_Push' scenario-git-http.log; then
            echo "::error::no TestGitHTTP_Push* scenario passed"
            exit 1
          fi

      - name: TestBootstrapInternalAdmin_* scenarios (must pass, never skip)
        shell: bash
        run: |
          go test -tags scenario -count=1 -run '^TestBootstrapInternalAdmin_' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-bootstrap-admin.log
          if grep -E '^[[:space:]]*--- SKIP: TestBootstrapInternalAdmin_' scenario-bootstrap-admin.log; then
            echo "::error::a TestBootstrapInternalAdmin_ scenario or step skipped — they must pass, never skip"
            exit 1
          fi
          for t in TestBootstrapInternalAdmin_IdempotencyAndRotation TestBootstrapInternalAdmin_PooledBuilderIdempotencyAndRotation; do
            if ! grep -qE "^--- PASS: ${t} " scenario-bootstrap-admin.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done

      # INIT-023 / EPIC-004 / TASK-014: the workflow-lifecycle scenarios
      # (a reviewer's update of an existing workflow reaches main only
      # through its lifecycle run's review, and under spine serve's strict
      # step-entry policy the draft author cannot approve it) and the
      # pooled workflow service's projection-backed branch-protection
      # policy are the Postgres-backed evidence for audit F7. Both are
      # green and must never skip.
      - name: TestWorkflowLifecycle_* scenarios (must pass, never skip)
        shell: bash
        run: |
          go test -tags scenario -count=1 -run '^TestWorkflowLifecycle_' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-workflow-lifecycle.log
          if grep -E '^[[:space:]]*--- SKIP: TestWorkflowLifecycle_' scenario-workflow-lifecycle.log; then
            echo "::error::a TestWorkflowLifecycle_ scenario or step skipped — they must pass, never skip"
            exit 1
          fi
          for t in TestWorkflowLifecycle_UpdateExisting TestWorkflowLifecycle_UpdateExisting_DraftAuthorCannotReview; do
            if ! grep -qE "^--- PASS: ${t} " scenario-workflow-lifecycle.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done

      - name: Pooled workflow-service branch protection (integration; must pass, never skip)
        shell: bash
        run: |
          go test -tags integration -count=1 -run '^TestBuildServiceSet_WorkflowServiceHasProjectionPolicy$' -v ./service/internal/workspace/ 2>&1 | tee integration-workflow-policy.log
          if grep -E '^[[:space:]]*--- SKIP: ' integration-workflow-policy.log; then
            echo "::error::the pooled workflow-policy integration test skipped — it must pass, never skip"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestBuildServiceSet_WorkflowServiceHasProjectionPolicy ' integration-workflow-policy.log; then
            echo "::error::TestBuildServiceSet_WorkflowServiceHasProjectionPolicy did not pass"
            exit 1
          fi

      # INIT-023 / EPIC-002 / TASK-008: the PostgreSQL store's conditional
      # step-execution, run-status, run-cursor and branch-cursor writes (audit P3-24: a
      # lost race writes nothing; one of two racers applies), the removal of a
      # lost claim's assignment row (review round 2), and the two
      # scenarios that carry P3-19/P3-24 end to end — step-output evidence
      # recorded at submit and read back for run detail after the run's
      # event-log rows are deleted, and a completed execution never routed
      # twice. All green and must never skip.
      - name: TASK-008 store compare-and-swap and step-output evidence (must pass, never skip)
        shell: bash
        run: |
          go test -tags integration -count=1 -run '^(TestTransitionStepExecution_|TestTransitionRunStatusAt$|TestTransitionCurrentStep$|TestTransitionBranchCursor$|TestDeleteAssignment$)' -v ./adapters/store/ 2>&1 | tee integration-step-cas.log
          go test -tags scenario -count=1 -run '^(TestStepOutputEvidence_RecordedAndReadBack|TestCompletedStep_IsNotReRouted)$' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-step-evidence.log
          if grep -hE '^[[:space:]]*--- SKIP: ' integration-step-cas.log scenario-step-evidence.log; then
            echo "::error::a TASK-008 store or scenario test skipped — they must pass, never skip"
            exit 1
          fi
          for t in TestTransitionStepExecution_AppliesOnMatch TestTransitionStepExecution_MissesOnMismatch TestTransitionStepExecution_MissingRow TestTransitionStepExecution_OneOfTwoRacersApplies TestTransitionRunStatusAt TestTransitionCurrentStep TestTransitionBranchCursor TestDeleteAssignment; do
            if ! grep -qE "^--- PASS: ${t} " integration-step-cas.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done
          for t in TestStepOutputEvidence_RecordedAndReadBack TestCompletedStep_IsNotReRouted; do
            if ! grep -qE "^--- PASS: ${t} " scenario-step-evidence.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done

      # INIT-023 / EPIC-002 / TASK-017: the declared artifact-status
      # lifecycle end to end on the scenario runtime (the planning package
      # cascade, a refused non-owned status edit, artifacts_dir) and the
      # pooled validator's blocking status conflicts — the one standalone
      # wiring line only a database-backed test catches — are the
      # Postgres-backed evidence for audit P3-21. All are green and must
      # never skip.
      - name: Status-lifecycle scenarios and pooled validator (must pass, never skip)
        shell: bash
        run: |
          go test -tags scenario -count=1 -run 'StatusLifecycle' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-status-lifecycle.log
          if grep -E '^[[:space:]]*--- SKIP: ' scenario-status-lifecycle.log; then
            echo "::error::a status-lifecycle scenario or step skipped — they must pass, never skip"
            exit 1
          fi
          for t in TestPlanningRun_StatusCascadesToChildren_StatusLifecycle TestStandardRun_StatusLifecycleRefusesNonOwnedStatusEdit TestStandardRun_StatusLifecycleArtifactsDir; do
            if ! grep -qE "^--- PASS: ${t} " scenario-status-lifecycle.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done
          go test -tags integration -count=1 -run '^TestBuildServiceSet_ValidatorBlocksStatusConflicts$' -v ./service/internal/workspace/ 2>&1 | tee integration-status-lifecycle.log
          if grep -E '^[[:space:]]*--- SKIP: ' integration-status-lifecycle.log; then
            echo "::error::the pooled validator's blocking-status-conflicts test skipped — it must pass, never skip"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestBuildServiceSet_ValidatorBlocksStatusConflicts ' integration-status-lifecycle.log; then
            echo "::error::TestBuildServiceSet_ValidatorBlocksStatusConflicts did not pass"
            exit 1
          fi

      # INIT-023 / EPIC-002 / TASK-006: the governance-path guard end to end
      # (a held merge, the contributor's 403, the operator's approval
      # through the API, the projection installing the approved workflow)
      # and its provenance SQL (the override events and consumed approvals
      # the projection's protection-removal guard trusts, the atomic and
      # conditional commit_meta writes). Postgres-backed; must never skip.
      - name: Governance-path guard scenario and store (must pass, never skip)
        shell: bash
        run: |
          go test -tags scenario -count=1 -run '^TestGovernancePathGuard_' -v ./service/scenariotest/scenarios/ 2>&1 | tee scenario-governance.log
          go test -tags integration -count=1 -run '^TestGovernanceStore_Integration$' -v ./adapters/store/ 2>&1 | tee integration-governance-store.log
          if grep -E '^[[:space:]]*--- SKIP: ' scenario-governance.log integration-governance-store.log; then
            echo "::error::a governance-path guard test skipped — it must pass, never skip"
            exit 1
          fi
          for t in TestGovernancePathGuard_HeldUntilOperatorApproves; do
            if ! grep -qE "^--- PASS: ${t} " scenario-governance.log; then
              echo "::error::${t} did not pass"
              exit 1
            fi
          done
          if ! grep -qE '^--- PASS: TestGovernanceStore_Integration ' integration-governance-store.log; then
            echo "::error::TestGovernanceStore_Integration did not pass"
            exit 1
          fi

      # INIT-024 / EPIC-003 / TASK-008: a WORKSPACE_RESOLVER=db deployment
      # (a registry and three workspace databases, wired exactly as serveCmd
      # wires them) runs the multi-workspace scheduler: step and run
      # timeouts, the orphan scan and merge retries fire in every workspace
      # on its own database, a workspace added at runtime is scanned and a
      # deactivated one is not, and no tick leaves a pool reference. The
      # only Postgres-backed evidence for the open half of audit P3-27;
      # must pass, never skip.
      - name: Shared-mode multi-workspace scheduler (integration; must pass, never skip)
        shell: bash
        run: |
          go test -tags integration -count=1 -run '^TestServe_DBModeMultiSchedulerFiresAcrossWorkspaces$' -v ./service/cmd/spine/ 2>&1 | tee integration-multi-scheduler.log
          if grep -E '^[[:space:]]*--- SKIP: ' integration-multi-scheduler.log; then
            echo "::error::the shared-mode scheduler integration test skipped — it must pass, never skip"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestServe_DBModeMultiSchedulerFiresAcrossWorkspaces ' integration-multi-scheduler.log; then
            echo "::error::TestServe_DBModeMultiSchedulerFiresAcrossWorkspaces did not pass"
            exit 1
          fi

  # INIT-023 / EPIC-001 / TASK-002: the git client's ref grammar (exact
  # `show-ref --verify` lookups, `--end-of-options`, `git switch
  # --no-guess`, `<oid>^{commit}` push sources, `worktree add --detach`)
  # must hold on the git that ships, not only on the runner's newer git:
  # the standalone and customer-app images install Debian bookworm's git
  # 2.39.5, and golang:1.26-bookworm carries the same package. The first
  # step is the task's acceptance filter; the second runs the whole git
  # adapter and the artifact/workflow services that drive it.
  git-floor:
    name: Ref grammar on shipped git (2.39.x)
    runs-on: ubuntu-latest
    needs: boundary-lint
    container:
      image: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Shipped git version
        run: |
          git --version
          git --version | grep -Eq '^git version 2\.39\.' || { echo "::error::expected Debian bookworm's git 2.39.x"; exit 1; }

      - name: Ref-grammar regression tests (git 2.39.x)
        run: go test -count=1 ./adapters/git/... ./core/engine/ -run 'RefShadow|RefGrammar|Checkout|EnterBranch|CurrentBranch'

      - name: Git adapter and services (git 2.39.x)
        run: go test -count=1 ./adapters/git/... ./core/artifact/ ./core/workflow/
