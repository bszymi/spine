# INIT-024 / EPIC-004 / TASK-009 (review SC-06): Dependabot proposes Go
# module, action and base-image updates weekly. Minor and patch updates are
# grouped per ecosystem, so one PR carries a week's routine bumps; a major
# update comes as its own PR. A new release waits a week (cooldown) before it
# is proposed, so a hijacked release that is yanked within days never
# reaches a PR. Security updates are not delayed by the cooldown.
#
# Actions and images are pinned by SHA / digest next to a version comment or
# tag; Dependabot moves both together.
#
# What Dependabot does not move, by design:
#   - go.mod's `toolchain` line. A golang image bump in the Dockerfile
#     arrives without it, and the toolchain-parity job (dev/pincheck) fails
#     on that PR until go.mod's toolchain, the ci.yml git-floor container and
#     the Makefile's DOCKER_GO name the same golang tag and digest. That red
#     is the alarm working: under the image's GOTOOLCHAIN=local, a half-done
#     bump silently ships the old compiler.
#   - The image references inside .github/workflows/ci.yml (the git-floor
#     container and the postgres service) and the govulncheck version
#     (`go run ...@vX.Y.Z` in ci.yml and the Makefile). Move them by hand
#     with the matching Dockerfile / compose update.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dockerfile: the golang builder and the debian runtime base.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # docker-compose.yaml and docker-compose.test.yaml: postgres and localstack
  # (dev and test stacks only).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
