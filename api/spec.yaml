openapi: 3.1.0
info:
  title: Spine API
  version: 0.1.0
  description: |
    Spine v0.x API specification. See /architecture/api-operations.md for
    operation semantics, domain rules, and governance model.

servers:
  - url: /api/v1
    description: Spine API v1

security:
  - BearerToken: []

# ─── Paths ──────────────────────────────────────────────────────────────────

paths:

  # ── Artifact Operations ──

  /artifacts:
    post:
      operationId: artifact.create
      summary: Create a new artifact
      description: |
        Creates a new governed artifact. Workflow definition paths are rejected —
        per ADR-007, workflow definitions must be created through `workflow.create`
        (`POST /workflows`).
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreateRequest'
      responses:
        '201':
          description: Artifact created
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCreateResponse'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '403':
          description: |
            Branch protection refused the write, or — with a `write_context`
            naming a run — the caller is neither the actor bound to the
            run's current step nor an operator (the response never names
            the holder; see `WriteContext`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '409':
          description: |
            The artifact already exists (`already_exists`), or (`conflict`)
            With a `write_context` naming a run, the run's branch accepts no
            write from this caller now (see `WriteContext`): its current
            step is waiting or unassigned (claim it first;
            `detail.execution_id`), has no open execution, is a `review` or
            `internal` step (`detail.step_type`; every role), is routed to a
            code repository (`detail.repository_id`), or cannot be resolved;
            or the run has no run-level current step or no engine run
            branch (operators only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    get:
      operationId: artifact.list
      summary: List artifacts
      tags: [Artifacts]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: parent_path
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Artifact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'

  /artifacts/entry:
    post:
      operationId: artifact.entry
      summary: Create artifact through governed workflow
      description: |
        Allocates the next sequential ID, builds artifact content, and starts a
        planning run with the appropriate creation workflow. This is the high-level
        artifact creation entry point — it handles ID allocation, slug generation,
        parent resolution, and workflow binding automatically.
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactEntryCreateRequest'
      responses:
        '201':
          description: Planning run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactEntryCreateResponse'
        '400':
          description: Invalid input (missing title, unsupported type, wrong parent type)
        '404':
          description: Parent artifact not found

  /artifacts/add:
    post:
      operationId: artifact.add
      summary: Add artifact to a planning run branch
      description: |
        Adds an artifact to an existing planning run's branch. Only works while
        the run is in the draft step. Scans the branch (not main) for the next
        available ID. The parent must exist on the branch or on main.

        Workflow definition paths are rejected — per ADR-007, workflow
        definitions must be created through `workflow.create` (`POST /workflows`).
        A run that governs a workflow definition (task path under
        `workflows/`) accepts no artifacts (400).

        Only the actor bound to the run's draft step (its latest run-level
        execution, assigned or in progress) or an operator may add to the
        branch (INIT-023 TASK-014): 409 while the step is waiting or
        unassigned (claim it first; `detail.execution_id`) or has no open
        execution, 403 for any other caller. Authorization runs before any
        branch read.
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactAddRequest'
      responses:
        '201':
          description: Artifact created on branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactAddResponse'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '403':
          description: The caller is not the actor bound to the run's draft step (and not an operator)
        '404':
          description: Run not found
        '409':
          description: |
            Run is past the draft step, its draft step is waiting or
            unassigned, it has no open execution for the draft step, the
            draft step is routed to a code repository
            (`detail.repository_id`; the branch written is the primary
            repository's), or the step definition cannot be resolved

  /artifacts/{path}:
    get:
      operationId: artifact.read
      summary: Read an artifact
      description: |
        Reads an artifact by repository-relative path. For workflow definition
        paths, the response contains summary metadata only (no executable body).
        Use `workflow.read` (`GET /workflows/{id}`) to retrieve the executable
        workflow definition.
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/ArtifactPath'
        - name: ref
          in: query
          schema: { type: string }
          description: Git ref to read from (default authoritative branch HEAD)
      responses:
        '200':
          description: Artifact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactReadResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: artifact.update
      summary: Update an artifact
      description: |
        Updates a governed artifact. Workflow definition paths are rejected —
        per ADR-007, workflow definitions must be updated through `workflow.update`
        (`PUT /workflows/{id}`).
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/ArtifactPath'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdateRequest'
      responses:
        '200':
          description: Artifact updated
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUpdateResponse'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '403':
          description: |
            Branch protection refused the write, or — with a `write_context`
            naming a run — the caller is neither the actor bound to the
            run's current step nor an operator (the response never names
            the holder; see `WriteContext`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            With a `write_context` naming a run, the run's branch accepts no
            write from this caller now (see `WriteContext`): its current
            step is waiting or unassigned (claim it first;
            `detail.execution_id`), has no open execution, is a `review` or
            `internal` step (`detail.step_type`; every role), is routed to a
            code repository (`detail.repository_id`), or cannot be resolved;
            or the run has no run-level current step or no engine run
            branch (operators only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /artifacts/{path}/validate:
    post:
      operationId: artifact.validate
      summary: Validate an artifact
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/ArtifactPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Content to validate (if omitted, validates current artifact)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /artifacts/{path}/links:
    get:
      operationId: artifact.links
      summary: Query artifact relationships
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/ArtifactPath'
        - name: link_type
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema:
            type: string
            enum: [outgoing, incoming, both]
            default: outgoing
      responses:
        '200':
          description: Artifact links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactLinksResponse'

  # ── Workflow Definition Operations ──
  # See ADR-007 for rationale. Dedicated resource so workflow-specific
  # validation (step-reference integrity, cycle detection, divergence/
  # convergence balance) runs in a single code path and malformed
  # definitions fail at write time rather than Run execution time.

  /workflows:
    post:
      operationId: workflow.create
      summary: Create a new workflow definition
      description: |
        Creates a new workflow definition. The full workflow validation suite
        (per /architecture/workflow-validation.md) runs before commit. On
        validation failure, no Git state changes. The standalone server also
        refuses (422, before any planning run starts) step, divergence-point,
        divergence-branch and convergence-point IDs outside
        `^[a-z0-9][a-z0-9_-]{0,63}$` (workflow-definition-format §3.6).

        Dispatch (ADR-008, INIT-023 TASK-014):
        - reviewer, no `write_context`: opens a `workflow-lifecycle`
          planning run (201, `WorkflowPlanningResponse`); 503 when no
          planning starter is configured; 409 when a non-terminal lifecycle
          run is already open for the id (the error detail names it), or
          when the id already exists (use `PUT /workflows/{id}`) — refused
          before any branch or run exists;
        - `write_context { run_id }`: writes on that run's branch (201,
          `write_mode: proposed`); the run must be the planning run that
          governs `workflows/<id>.yaml` and the caller its draft assignee
          or an operator (see `WriteContext`);
        - operator or admin, no `write_context`: the ADR-008 bypass, a
          direct commit with a `Workflow-Bypass: true` trailer (201,
          `write_mode: bypass`).
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreateRequest'
      responses:
        '201':
          description: |
            Workflow created (`WorkflowWriteResponse`: bypass or proposed),
            or a workflow-lifecycle planning run opened for a reviewer
            (`WorkflowPlanningResponse`, `write_mode: planning`).
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkflowWriteResponse'
                  - $ref: '#/components/schemas/WorkflowPlanningResponse'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The workflow already exists, a workflow-lifecycle run is already
            open for it (`detail.run_id`), or the run named by
            `write_context` is in a step that refuses writes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'

    get:
      operationId: workflow.list
      summary: List workflow definitions
      description: |
        Returns workflow definition summaries only (no executable body).
      tags: [Workflows]
      parameters:
        - name: applies_to
          in: query
          schema: { type: string }
          description: Filter by artifact type the workflow applies to
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Deprecated, Superseded]
        - name: mode
          in: query
          schema:
            type: string
            enum: [execution, creation]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Workflow definition list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'

  /workflows/{id}:
    get:
      operationId: workflow.read
      summary: Read a workflow definition
      description: |
        Returns the executable workflow definition body. This is the only
        endpoint that returns the full body — `artifact.read`, `query.artifacts`,
        and `query.graph` return summary metadata only.
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: version
          in: query
          schema: { type: string }
          description: Optional specific version (default latest on authoritative branch)
        - name: ref
          in: query
          schema: { type: string }
          description: Git ref to read from (default authoritative branch HEAD)
      responses:
        '200':
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: workflow.update
      summary: Update a workflow definition
      description: |
        Updates an existing workflow definition. Version bump relative to the
        prior definition is required. The full workflow validation suite runs
        before commit. The identifier rule of `workflow.create` applies (422).

        Dispatch is identical to `workflow.create` (ADR-008, INIT-023
        TASK-014): a reviewer without `write_context` opens an update
        `workflow-lifecycle` planning run (201, `WorkflowPlanningResponse`)
        — before TASK-014 this committed straight to the authoritative
        branch. A missing workflow (404), an unchanged version (422) or an
        invalid id (400) is refused before any branch or run exists; 409
        when a lifecycle run is already open for the id; 503 when no
        planning starter is configured. `write_context { run_id }` writes
        on the workflow's own lifecycle run (200, `write_mode: proposed`);
        operators without `write_context` use the ADR-008 bypass (200,
        `write_mode: bypass`).
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequest'
      responses:
        '200':
          description: Workflow updated (bypass or proposed)
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWriteResponse'
        '201':
          description: An update workflow-lifecycle planning run was opened (reviewer, no `write_context`)
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanningResponse'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'

  /workflows/{id}/validate:
    post:
      operationId: workflow.validate
      summary: Validate a workflow definition without persisting
      description: |
        Runs the workflow validation suite against a candidate body. No Git
        state changes regardless of outcome. Identifiers that `workflow.create`
        and `workflow.update` would refuse are reported as `schema` errors with
        `status: failed`.
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/InvalidParams'

  # ── Workflow Operations ──

  /runs:
    post:
      operationId: run.start
      summary: Start a new Run for a task or planning run for artifact creation
      description: |
        Starts a standard run (default) or a planning run for governed artifact creation.
        Standard mode requires task_path. Planning mode requires artifact_content and
        creates the artifact on a branch via StartPlanningRun (per ADR-006).

        A planning-mode task_path under `workflows/` (any spelling: dot
        segments, repeated slashes, case folding) returns 400 with
        `use_operation: workflow.create` — workflow definitions are created
        only through the workflow-lifecycle planning run (INIT-023 TASK-014).
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Conditional requirements: task_path is required when mode is standard or omitted.
                artifact_content is required when mode is planning.
              properties:
                task_path:
                  type: string
                  description: Path to the task artifact. Required when mode is standard or omitted.
                mode:
                  type: string
                  enum: [standard, planning]
                  default: standard
                  description: Run mode. Standard executes against existing artifacts. Planning creates new artifacts on a branch.
                artifact_content:
                  type: string
                  description: Full artifact content (frontmatter + body). Required when mode is planning.
      responses:
        '201':
          description: Run created
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /runs/{run_id}:
    get:
      operationId: run.status
      summary: Query Run execution state
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs/{run_id}/cancel:
    post:
      operationId: run.cancel
      summary: Cancel an in-progress Run
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCancelResponse'
        '409':
          description: |
            Operation conflicts with current state — including a cancel that
            lost a race to a merge start (the run is now `committing`, where
            cancel is invalid) or to another writer (INIT-023 TASK-008: run
            status writes are compare-and-swap; retry against the new state).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'

  /runs/{run_id}/governance-decision:
    post:
      operationId: run.governance.decide
      summary: Approve or reject a governed merge held by the governance-path guard
      description: |
        ADR-016 (INIT-023 TASK-006). With the governance-path guard on (the
        `spine serve` default; `SPINE_GOVERNANCE_GUARD=off` disables it), a
        governed merge that changes `.spine/`, `.spine.yaml`, `workflows/`
        or `<artifacts_dir>/workflows/` is held: the run stays `committing`
        until an operator decides. `commit_sha` must be the run's bound
        commit (`GET /runs/{run_id}/governance` shows it); an approval
        binds to that commit only.

        - `approve` records the approval (reserved `commit_meta` keys,
          `governance.merge_decided` event) — only while the run is still
          `committing` — and runs the merge at once. A merge that then
          fails is reported in `merge_error`; the approval stands, and
          approving the same commit again retries the merge.
        - `reject` (a `reason` is required) revokes any approval and takes
          the workflow's `merge_failed` route (back to `execute` in
          task-default), or fails a run whose workflow has no publish step
          (the branch is kept).

        A decision waits for a merge attempt of the run already in flight
        and then sees its result: a reject after the approved merge
        completed or reached the local `main` is `409` (the merge won).

        Operator or admin only; the engine checks the role again.
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, commit_sha]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                commit_sha:
                  type: string
                  pattern: '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'
                  description: The run's bound commit (full hex id).
                reason:
                  type: string
                  maxLength: 2000
                  description: Required for reject.
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  commit_sha: { type: string }
                  decision: { type: string, enum: [approve, reject] }
                  paths:
                    type: array
                    items: { type: string }
                    description: Governance paths the merge changes (capped).
                  path_count: { type: integer }
                  merge_attempted: { type: boolean }
                  merge_error:
                    type: string
                    description: Approve only — the merge after the approval did not complete (including a merge refused after the approval whose take-back failed; the run then stays `committing`).
                  run_status: { type: string }
        '400':
          description: Malformed body, unknown decision, malformed commit_sha, a reason over 2000 bytes, or a reject without a reason
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run is not committing (an approve that finds it left committing records nothing), commit_sha is not the run's bound commit (the message names the bound commit), a reject after the approved merge already reached the local main, or a reject while a refused merge of the run that could not be taken back is still on the local main (`blocked` in `GET /runs/{run_id}/governance`)
        '412':
          description: The run's merge changes no governance path, or can never be evaluated (no merge base, a diff over the git output limit — the guard refuses it on its next attempt); there is nothing to decide
        '503':
          description: The governance-path guard is off, the engine is not wired, the merge's changed paths could not be computed this time, another decision or merge attempt on the run did not finish in time, or the run's exhausted merge retries are being abandoned at that moment (retry; nothing was recorded)

  /runs/{run_id}/governance:
    get:
      operationId: run.governance.status
      summary: Read a run's governance-path guard state
      description: |
        Whether the run's merge changes governance paths, whether it is held
        for an operator decision, the bound commit, the paths (capped,
        `truncated` when cut) and exemptions, and the recorded approval.
        `evaluated` is false (with `evaluation_error`) when the run has no
        bound commit yet or its changed paths could not be computed.
        Requires the `run.status` permission.
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Governance state
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  run_status: { type: string }
                  evaluated: { type: boolean }
                  evaluation_error: { type: string }
                  bound_sha: { type: string }
                  required: { type: boolean }
                  held:
                    type: boolean
                    description: Held for an operator decision (never while `blocked`).
                  blocked:
                    type: boolean
                    description: |
                      A merge of the run that was refused, or whose approval
                      could not be recorded, could not be taken back and is
                      still on the local `main` (`blocked_merge_sha`).
                      Governed merges are blocked on it; the run stays
                      `committing` and its next attempt takes it back first.
                      The paths are then computed against a `main` that
                      holds that merge. A reject is `409` meanwhile.
                  blocked_merge_sha: { type: string }
                  paths:
                    type: array
                    items: { type: string }
                  path_count: { type: integer }
                  truncated: { type: boolean }
                  exempt_paths:
                    type: array
                    items: { type: string }
                  approval:
                    type: object
                    nullable: true
                    properties:
                      sha: { type: string }
                      actor_id: { type: string }
                      actor_role: { type: string }
                      approved_at: { type: string }
                      merge_sha: { type: string }
                      base_sha: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The governance-path guard is off or the engine is not wired

  /steps/{assignment_id}/submit:
    post:
      operationId: step.submit
      summary: Submit step result
      tags: [Workflow]
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepSubmitRequest'
      responses:
        '200':
          description: |
            Step result accepted, or — for a duplicate submission or one that
            lost a race to another writer (another submit, the timeout
            scanner; INIT-023 TASK-008) — the execution's persisted terminal
            state, unchanged.
          headers:
            X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepSubmitResponse'
        '400':
          description: |
            Invalid request (`invalid_params`). Besides an undefined outcome
            or missing required outputs, a malformed or inapplicable
            `expected_head_sha` (INIT-023 TASK-005): `detail.reason` is
            `expected_head_sha_invalid` (not a full lowercase hex commit
            id) or `expected_head_sha_not_applicable` (the run has no
            branch, the step is on a divergence branch, or the step is an
            internal engine step). A malformed assertion is refused before
            the required-outputs check, so it never fails the step.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '403':
          description: |
            `forbidden`: the step execution is bound to another actor. The
            gateway checks it, and the engine checks it again with the
            authenticated actor (INIT-023 TASK-008), before anything else —
            on a completed execution too — so a non-owner can neither
            complete nor fail another actor's step.
        '409':
          description: |
            Operation conflicts with current state — including an execution
            that moved (rebound, released) between the submission's
            validation and its write (INIT-023 TASK-008). With SHA-bound merges
            (INIT-023 TASK-005) `detail.reason` names a run-branch head
            conflict, and `detail.head_sha` the head the server resolved:
            - `run_branch_moved`: `expected_head_sha` is not the run
              branch's current head (`detail.expected_head_sha`). Review
              the current head and submit again.
            - `run_branch_moved_since_gate`: a review or convergence step
              submitted an outcome that leads to the merge, but the run
              branch moved since the commit the previous step bound
              (`detail.bound_sha`, `detail.bound_by`). The commits after
              the binding were not validated, so only a rework outcome may
              follow. This includes a commit that reached the branch during
              the review (an operator's push, or a push started before it;
              `/artifacts/add` and `write_context` writes are refused during
              a review step, INIT-023 TASK-014): send the work back so it is
              validated again.
            Both are answered before the required-outputs check, so a
            submit that also lacks a required output is refused with the
            409 and the step is not failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: |
            `service_unavailable`. With `detail.reason`
            `run_branch_head_unavailable` the run-branch head could not be
            resolved, so a submit that must bind it was not recorded (retry
            later; the step is not failed, also when the submit lacks a
            required output); with `expected_head_sha_unsupported` the
            deployment cannot check an assertion (INIT-023 TASK-005).

  /runs/{run_id}/steps/{step_id}/assign:
    post:
      operationId: step.assign
      summary: Assign actor to a step
      tags: [Workflow]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: step_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id:
                  type: string
                eligible_actor_ids:
                  type: array
                  items: { type: string }
                  description: >
                    Replaces the execution's stored allow-list. Under the
                    engine step-entry policy the actor must be in the
                    effective list (this one when non-empty, else the stored
                    one).
      description: >
        Under the engine step-entry policy (`SPINE_STEP_ENTRY_POLICY`, strict by
        default; INIT-023 TASK-007) the engine checks, in order and before
        writing anything: run is `active` (409), step is not engine-owned (409),
        actor type matches the execution mode (409), actor exists (404) and is
        `active` (403), allow-list (403) and `eligible_actor_types` (409),
        `required_skills` (409), separation of duties (403), preconditions (412).
        A check that cannot run (no skill lookup, unreadable assignment ledger,
        no orchestrator wired) answers 503, as does a request whose context
        ends while it waits for the run's separation-of-duties bind lock.
      responses:
        '200':
          description: Actor assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: Step preconditions not met
        '503':
          description: Step assigner or a step-entry check dependency not configured

