# ─── Components ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: API token (per Security Model §3.3)

  headers:
    XTraceId:
      description: Observability trace ID for correlation across systems
      schema: { type: string, format: uuid }

  parameters:
    ArtifactPath:
      name: path
      in: path
      required: true
      schema: { type: string }
      description: Repository-relative artifact path

    TaskPath:
      name: path
      in: path
      required: true
      schema: { type: string }
      description: Repository-relative task artifact path

    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }

    WorkflowId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Stable workflow identifier (e.g. `task-default`)

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200

    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor

    XTraceId:
      name: X-Trace-Id
      in: header
      schema: { type: string, format: uuid }
      description: Observability trace ID. Generated by server if omitted.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: Idempotency key for write operations. Falls back to X-Trace-Id if omitted.

  schemas:

    # ── Artifact Entry ──

    ArtifactEntryCreateRequest:
      type: object
      required: [artifact_type, title]
      properties:
        artifact_type:
          type: string
          enum: [Task, Epic, Initiative]
          description: Type of artifact to create
        parent:
          type: string
          description: Parent artifact ID (required for Task and Epic)
        title:
          type: string
          description: Human-readable artifact title

    ArtifactEntryCreateResponse:
      type: object
      properties:
        run_id: { type: string, description: Planning run ID }
        artifact_id: { type: string, description: Allocated artifact ID (e.g., TASK-006) }
        artifact_path: { type: string, description: Full artifact path }
        branch: { type: string, description: Planning run branch name }
        workflow_id: { type: string, description: Resolved creation workflow ID }
        trace_id: { type: string }

    ArtifactAddRequest:
      type: object
      required: [run_id, artifact_type, parent, title]
      properties:
        run_id:
          type: string
          description: Planning run to add the artifact to
        artifact_type:
          type: string
          enum: [Task, Epic]
          description: Type of artifact to add
        parent:
          type: string
          description: Parent artifact ID (on the branch or main)
        title:
          type: string
          description: Human-readable artifact title

    ArtifactAddResponse:
      type: object
      properties:
        artifact_id: { type: string, description: Allocated artifact ID }
        artifact_path: { type: string, description: Full artifact path on branch }
        branch: { type: string, description: Planning run branch name }
        trace_id: { type: string }

    # ── Common ──

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail:
          type: object
          description: Error-specific structured detail
          properties:
            rule_id: { type: string }
            artifact_path: { type: string }
            field: { type: string }
            severity: { type: string }
            required_role: { type: string }
            actor_role: { type: string }
            required_skill: { type: string }

    PaginationMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    WriteContext:
      type: object
      description: |
        Controls where artifact writes land (authoritative branch vs task branch) and opts into the branch-protection override surface.

        A write with a `run_id` lands on that run's branch and is accepted
        only from the actor bound to the run's current step (its latest
        run-level execution, `assigned` or `in_progress`, on an `active`
        run) or from an operator (INIT-023 TASK-014): 409 while the step is
        `waiting` or unassigned (claim it first; `detail.execution_id`) or
        has no open execution, 403 for any other caller (the response never
        names the holder). While the current step is a `review` or
        `internal` step the branch is frozen for every role, operators
        included (409, `detail.step_type`). API writes land on the run's
        branch in the primary repository, so while the current step is
        routed to a code repository (ADR-015 `repository: <id>`; a step
        writes only its own repository) the branch accepts them only from
        operators: its holder gets 409 with `detail.repository_id` (the
        same rule as a push of that branch). A run with no run-level current
        step (legacy, or diverged) accepts API writes only from operators.
        A run that governs a workflow definition accepts no artifact writes
        (400).

        On workflow endpoints `run_id` is required (`{}` is 400 for every
        role: omit `write_context` instead) and must name the planning run
        that governs `workflows/<id>.yaml`.
      properties:
        run_id:
          type: string
          description: If provided, write targets the task branch for this Run
        task_path:
          type: string
          description: Task context for the write (required when run_id is provided)
        override:
          type: boolean
          default: false
          description: |
            Opts the caller into the per-operation branch-protection override
            (ADR-009 §4). The policy gate is effective only for actors with
            `operator+` role; lower roles see a 403 with reason
            `override_not_authorised`. An honored override on the Spine API
            path emits a `branch_protection.override` governance event and
            adds a `Branch-Protection-Override: true` commit trailer. Today
            only artifact endpoints honor this flag — workflow endpoints
            reject `override: true` with 400 (use the ADR-008 operator-
            bypass path instead). Workflow writes are nevertheless evaluated
            by branch protection: a non-bypass workflow write to a protected
            branch is refused with 403.

    # ── Artifact Schemas ──

    ArtifactSummary:
      type: object
      required: [artifact_path, artifact_type]
      properties:
        artifact_path: { type: string }
        artifact_id: { type: string }
        artifact_type: { type: string }
        status: { type: string }
        title: { type: string }

    ArtifactCreateRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        write_context:
          $ref: '#/components/schemas/WriteContext'

    ArtifactCreateResponse:
      type: object
      required: [artifact_path, artifact_type, commit_sha, trace_id]
      properties:
        artifact_path: { type: string }
        artifact_id: { type: string }
        artifact_type: { type: string }
        commit_sha: { type: string }
        trace_id: { type: string }
        write_mode: { type: string, enum: [authoritative, proposed] }

    ArtifactReadResponse:
      type: object
      required: [artifact_path, artifact_type, source_commit]
      properties:
        artifact_path: { type: string }
        artifact_id: { type: string }
        artifact_type: { type: string }
        status: { type: string }
        title: { type: string }
        metadata: { type: object }
        content: { type: string }
        source_commit: { type: string }

    ArtifactUpdateRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        write_context:
          $ref: '#/components/schemas/WriteContext'

    ArtifactUpdateResponse:
      type: object
      required: [artifact_path, commit_sha, trace_id]
      properties:
        artifact_path: { type: string }
        commit_sha: { type: string }
        trace_id: { type: string }
        write_mode: { type: string, enum: [authoritative, proposed] }

    ArtifactListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactSummary'

    ArtifactLinksResponse:
      type: object
      required: [artifact_path, links]
      properties:
        artifact_path: { type: string }
        links:
          type: array
          items:
            type: object
            required: [direction, link_type, target_path]
            properties:
              direction: { type: string, enum: [outgoing, incoming] }
              link_type: { type: string }
              target_path: { type: string }

    ValidationResult:
      type: object
      required: [artifact_path, status]
      properties:
        artifact_path: { type: string }
        status: { type: string, enum: [passed, failed, warnings] }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Error'

    # ── Workflow Definition Schemas ──

    WorkflowSummary:
      type: object
      required: [id, workflow_path, version, status]
      properties:
        id: { type: string, description: Stable workflow identifier }
        workflow_path: { type: string, description: Repository-relative path (e.g. /workflows/task-default.yaml) }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [Active, Deprecated, Superseded] }
        mode: { type: string, enum: [execution, creation] }
        applies_to:
          type: array
          items: { type: string }
        description: { type: string }

    WorkflowCreateRequest:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          description: Stable workflow identifier (determines the file path `/workflows/{id}.yaml`)
        body:
          type: string
          description: YAML body of the workflow definition

    WorkflowUpdateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: YAML body of the updated workflow definition (must bump `version`)

    WorkflowValidateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Candidate YAML body to validate

    WorkflowReadResponse:
      allOf:
        - $ref: '#/components/schemas/WorkflowSummary'
        - type: object
          required: [body, source_commit]
          properties:
            body: { type: string, description: Executable YAML body }
            source_commit: { type: string }

    WorkflowWriteResponse:
      type: object
      required: [id, workflow_path, version, commit_sha, trace_id]
      properties:
        id: { type: string }
        workflow_path: { type: string }
        version: { type: string }
        commit_sha: { type: string }
        trace_id: { type: string }
        write_mode:
          type: string
          enum: [proposed, bypass]
          description: '`proposed` on a lifecycle run branch, `bypass` for the ADR-008 operator direct commit'
        workflow_bypass: { type: boolean, description: Present and true on a bypass write }

    WorkflowPlanningResponse:
      type: object
      description: |
        A `workflow.create` or `workflow.update` by a caller below operator
        with no `write_context` opened a `workflow-lifecycle` planning run
        (ADR-008). The definition is on `branch_name`; the authoritative
        branch changes only when the run's review approves.
      required: [run_id, branch_name, workflow_id, workflow_path, write_mode]
      properties:
        run_id: { type: string }
        branch_name: { type: string }
        workflow_id: { type: string }
        workflow_path: { type: string, description: 'workflows/<id>.yaml' }
        governing_workflow_id: { type: string, description: The governing lifecycle workflow (workflow-lifecycle) }
        status: { type: string }
        mode: { type: string, enum: [planning] }
        trace_id: { type: string }
        write_mode: { type: string, enum: [planning] }

    WorkflowListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowSummary'

    # ── Run Schemas ──

    RunResponse:
      type: object
      required: [run_id, task_path, workflow_id, status, trace_id]
      properties:
        run_id: { type: string }
        task_path: { type: string }
        workflow_id: { type: string }
        workflow_version: { type: string }
        trace_id: { type: string }
        status: { type: string }
        mode: { type: string, enum: [standard, planning], description: "Run mode — standard or planning" }

    StepExecution:
      type: object
      required: [execution_id, step_id, status, attempt]
      properties:
        execution_id: { type: string }
        step_id: { type: string }
        status: { type: string }
        actor_id: { type: string, nullable: true }
        outcome_id: { type: string, nullable: true }
        attempt: { type: integer }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    RunStatusResponse:
      type: object
      required: [run_id, task_path, workflow_id, status, trace_id]
      properties:
        run_id: { type: string }
        task_path: { type: string }
        workflow_id: { type: string }
        status: { type: string }
        mode: { type: string, enum: [standard, planning], description: "Run mode — standard or planning" }
        current_step_id: { type: string, nullable: true }
        trace_id: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        step_executions:
          type: array
          items:
            $ref: '#/components/schemas/StepExecution'
        step_output_evidence:
          type: array
          description: |
            Step-output evidence (INIT-023 TASK-008, audit P3-19), one entry
            per completed primary-branch execution that recorded it, oldest
            first. Read from the run's reserved `commit_meta` keys
            (`spine.evidence.<execution_id>`), so it survives event-log
            retention; recorded only with SHA-bound merges on. Absent when
            there is none or the reader failed (logged).
          items:
            $ref: '#/components/schemas/StepOutputEvidence'

    StepOutputEvidence:
      type: object
      required: [execution_id, step_id, attempt, outcome_id, branch_change, required_outputs_unchanged]
      properties:
        execution_id: { type: string }
        step_id: { type: string }
        attempt: { type: integer }
        actor_id: { type: string }
        outcome_id: { type: string }
        required_outputs:
          type: array
          items: { type: string }
          description: The step's declared required_outputs (logical labels).
        required_outputs_unchanged:
          type: boolean
          description: |
            The step declared required_outputs and the run branch content is
            provably unchanged (`branch_change.status` `unchanged`, including a
            moved head whose diff found no changed path).
        branch_change:
          $ref: '#/components/schemas/BranchChange'

    BranchChange:
      type: object
      required: [repository_id, status]
      description: |
        Whether the run branch moved between the run's previous recorded
        head and the head recorded for one execution (primary repository
        only). Evidence, not enforcement.
      properties:
        repository_id: { type: string, enum: [spine] }
        status: { type: string, enum: [unchanged, changed, unknown, not_applicable] }
        head_sha: { type: string }
        previous_sha: { type: string }
        previous_source:
          type: string
          description: The previous binding's `spine.bound_by`, or `baseline`.
        changed_paths:
          type: integer
          description: 0 when unchanged; the diff's entry count when changed; absent otherwise.
        reason:
          type: string
          description: |
            For `unknown` / `not_applicable`: `head_sha_unrecorded`,
            `no_previous_sha`, `diff_failed:<kind>`, `divergence_branch`,
            `no_run_branch` or `recovered`. For `unchanged`:
            `head_moved_tree_unchanged` when the head moved but the diff of
            the previous and the recorded head found no changed path (an
            empty commit, a change and its revert); absent when the two heads
            are equal.

    RunCancelResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [cancelled] }

    RunListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RunResponse'

    # ── Step Schemas ──

    StepSubmitRequest:
      type: object
      required: [outcome_id]
      properties:
        outcome_id:
          type: string
          description: One of the step's declared outcomes
        output:
          type: object
          properties:
            artifacts_produced:
              type: array
              items:
                type: object
                required: [path]
                properties:
                  path: { type: string }
                  artifact_type: { type: string }
                  status: { type: string, enum: [proposed, final] }
            data: { type: object }
            summary: { type: string }
        rationale:
          type: string
          description: Actor's notes or reasoning for this outcome
        validation_status:
          type: string
          enum: [passed, failed, skipped, not_run]
          description: Self-reported validation status of produced artifacts
        expected_head_sha:
          type: string
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
          description: |
            Optional (INIT-023 TASK-005). The run-branch head the submitter
            worked on: the commit a runner checked out and tested or pushed,
            or the head a reviewer read the diff at. The submit is refused
            with 409 `run_branch_moved` unless the run branch is still
            there, and with 400 when the value is malformed or the step
            cannot carry one. Checked whether or not merge binding is on.

    StepSubmitResponse:
      type: object
      required: [execution_id, step_id, outcome_id]
      properties:
        execution_id: { type: string }
        step_id: { type: string }
        outcome_id: { type: string }
        next_step: { type: string, nullable: true }
        commit_sha: { type: string, nullable: true }
        write_mode: { type: string, enum: [authoritative, proposed], nullable: true }
        validation_result:
          $ref: '#/components/schemas/ValidationResult'
        run_advanced: { type: boolean, description: Whether the Run moved to the next step }
        requires_review: { type: boolean, description: Whether the next step is a review step }

    AssignmentResponse:
      type: object
      required: [assignment_id, run_id, step_id, actor_id, status]
      properties:
        assignment_id: { type: string }
        run_id: { type: string }
        step_id: { type: string }
        actor_id: { type: string }
        status: { type: string, enum: [active] }

    # ── Task Governance Schemas ──

    TaskGovernanceResponse:
      type: object
      required: [task_path, status, commit_sha, trace_id]
      properties:
        task_path: { type: string }
        status: { type: string }
        acceptance: { type: string, nullable: true }
        commit_sha: { type: string }
        trace_id: { type: string }

    # ── Query Schemas ──

    GraphResponse:
      type: object
      required: [root, nodes, edges]
      properties:
        root: { type: string }
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSummary'
        edges:
          type: array
          items:
            type: object
            required: [source, target, link_type]
            properties:
              source: { type: string }
              target: { type: string }
              link_type: { type: string }

    HistoryEntry:
      type: object
      required: [commit_sha, timestamp, author, message]
      properties:
        commit_sha: { type: string }
        timestamp: { type: string, format: date-time }
        author: { type: string }
        message: { type: string }
        trace_id: { type: string, nullable: true }
        operation: { type: string, nullable: true }

    HistoryResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEntry'

    # ── System Schemas ──

    HealthResponse:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        components:
          type: object
          additionalProperties: { type: string }
        projection_lag_ms: { type: integer }
        active_runs: { type: integer }

    RebuildStartedResponse:
      type: object
      required: [status, rebuild_id]
      properties:
        status: { type: string, enum: [started] }
        rebuild_id: { type: string }

    RebuildStatusResponse:
      type: object
      required: [rebuild_id, status]
      properties:
        rebuild_id: { type: string }
        status: { type: string, enum: [in_progress, completed, failed] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        artifacts_processed: { type: integer, nullable: true }
        error_detail: { type: string, nullable: true }

    SystemValidationResponse:
      type: object
      required: [status, total_artifacts]
      properties:
        status: { type: string, enum: [passed, failed, warnings] }
        total_artifacts: { type: integer }
        passed: { type: integer }
        warnings: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    AlreadyExists:
      description: Resource already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    Conflict:
      description: Operation conflicts with current state
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    Unavailable:
      description: A required service is not configured on this server (for example no workflow planning starter), or a store read needed to decide failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    InvalidParams:
      description: |
        Request parameters invalid or not permitted on this endpoint. Returned
        by generic artifact write endpoints when the target is a workflow
        definition path (per ADR-007); the error payload names the
        corresponding `workflow.*` operation.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
